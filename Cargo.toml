[package]
name = "internship-scraper"
version = "0.2.6"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
dotenvy = "0.15.7"
ratatui = "0.30.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.2"

[[bin]]
name = "scraper"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
