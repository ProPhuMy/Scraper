ce, engagement, and adoption of Docusign's products.</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\">This is an internship role for 3 months of duration.</p><p style=\"margin: 0px;\">This position is an individual contributor role reporting to the Director, Product Data Science.</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\"><strong>Responsibility</strong></p><ul><li>Collaborate with cross-functional teams to research, build and improve data analysis to identify opportunities for product improvements, new product features, product utilization, and improve customer experience, engagement, and retention</li><li>Partner closely with the product managers, user researchers, engineers, and leadership to capture and prioritize potential insights, analysis, and data product opportunities that will drive maximum business impact</li><li>Leverage data to develop actionable analytical insights and present findings to senior management</li><li>Partner with Product teams to design, administer, and analyze the results of A/B and multivariate tests and other ML models</li><li>Design and build dashboards to provide actionable insights and key business metrics</li><li>Design, build and test reliable data pipelines to extract and transform data</li><li>Identify, design, and implement process improvements by automating manual processes for greater efficiency</li><li>Collaborate with stakeholders across organizations to support their data needs</li><li>Implement data quality checks to maintain the high quality of data</li><li>Optimize and maintain the existing pipelines</li><li>Document the work in confluence and Alation</li></ul> <br><hr><h2>Job Designation</h2><br><br><p style=\"margin: 0px;\"><strong>Hybrid:</strong> <span>Employee divides their time between in-office and remote work. Access to an office location is required. (Frequency: Minimum 2 days per week; may vary by team but will be weekly in-office expectation)</span></p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\"><span style=\"color: #000000;\">Positions at Docusign are assigned a job designation of either In Office, Hybrid or Remote and are specific to the role/job. Preferred job designations are not guaranteed when changing positions within Docusign. Docusign reserves the right to change a position's job designation depending on business needs and as permitted by local law.</span></p> <br><hr><h2>What you bring</h2><br><br><p style=\"margin: 0px;\"><strong>Basic</strong></p><ul><li>Currently in the process of obtaining, a Bachelors/MS degree in Computer Science, Information Systems or other related engineering field</li><li>Graduating in December 2027 and May/June 2028</li><li>English language proficiency: native or fluent</li><li>Experience with SQL for data analysis and data validation</li><li>Experience with data visualization tools such as Tableau, Power Bl, or similar</li><li>Experience with statistics and rigorous analytical techniques</li><li>Experience in extracting, transforming and loading data using any data platform</li><li>Hands-on experience solving real business problems using data and analytics</li><li>Experience in working with cross-functional teams</li><li>Experience delivering on multiple competing priorities</li><li>This role is not eligible for OPT or sponsorship now or in the future</li></ul><p style=\"margin: 0px;\"><strong>Preferred</strong></p><ul><li>Ability to present data in a visual format and explain the insights clearly and concisely</li><li>Experience with A/B testing, cohort analysis, user segmentation, and other core product analytics methodologies</li><li>Experience designing and refining machine learning models</li><li>Experience with Python or R</li><li>Familiarity with data engineering processes</li><li>Highly motivated, organized, self-starter who thrives in a fast-paced environment</li><li>A strong individual contributor who partners well with internal teams</li></ul> <br><hr><h2>Wage Transparency</h2><br><br><p style=\"margin: 0px;\">Pay for this position is based on a number of factors including geographic location and may vary depending on job-related knowledge, skills, and experience.</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\">Based on applicable legislation, the below details pay ranges in the following locations:</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\">California: <span data-sheets-root=\"1\">$38 - $44/</span>hour</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\"><strong>Work Authorization Notice: </strong>Please note that we do not provide visa sponsorship or immigration support for this position. Applicants must already be authorized to work in the United States on a full-time, permanent basis without the need for current or future sponsorship.</p><p style=\"margin: 0px;\">&nbsp;</p> <br><hr><h2>Life at Docusign</h2><br><br><p style=\"margin: 0px;\"><strong>Working here</strong></p><p style=\"margin: 0px;\">Docusign is committed to building trust and making the world more agreeable for our employees, customers and the communities in which we live and work. You can count on us to listen, be honest, and try our best to do what&rsquo;s right, every day. At Docusign, everything is equal.</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\">We each have a responsibility to ensure every team member has an equal opportunity to succeed, to be heard, to exchange ideas openly, to build lasting relationships, and to do the work of their life. Best of all, you will be able to feel deep pride in the work you do, because your contribution helps us make the world better than we found it. And for that, you&rsquo;ll be loved by us, our customers, and the world in which we live.</p><p style=\"margin: 0px;\">&nbsp;</p><p style=\"margin: 0px;\"><strong>Accommodation</strong></p><p style=\"margin: 0px;\">Docusign is committed to providing reasonable accommodations for qualified individuals w
