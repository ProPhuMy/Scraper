<script>
    $(function () {
        var opportunity = new US.Opportunity.CandidateOpportunityDetail({"Id":"1940672b-d3b1-4e15-a834-fde16cb5a420","Title":"Data Scientist Intern","Featured":false,"FullTime":true,"HoursPerWeek":37.5,"JobCategoryName":"Internship","Locations":[{"Id":"9e36b6bc-f017-5623-8469-a7f14bb6656d","LocalizedName":null,"LocalizedLocationId":null,"LocalizedDescription":"13-Indianapolis","Address":{"Line1":"10 West Market Street, Ste. 1600","Line2":null,"City":"Indianapolis","State":{"Name":"Indiana","Code":"IN"},"PostalCode":"46204","Country":{"Id":"2f4c285d-a1e2-49b1-9b6c-27b4c7f68b4c","Name":"United States","Code":"USA"}},"DisplayName":false,"DisplayLocationId":false,"DisplayDescription":true,"DisplayAddress":true,"DisplayStreetAddress":false,"Coordinates":{"Longitude":-86.15920854332802,"Latitude":39.768588138047896},"Shapes":null,"SourceOfTruth":1,"IsAvailableForOpportunities":true}],"PostedDate":"2026-11-23T19:07:31.521Z","UpdatedDate":"2026-11-23T19:07:11.424Z","RequisitionNumber":"DATAS010864","Description":"\u003cp\u003e\u003cstrong\u003eOverview\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMilliman\u0026rsquo;s Indianapolis Health practice is seeking a curious and motivated early-career Data Scientist to join our growing practice through a 12-week intern-to-hire program. This role is focused on applied data science and analytics in healthcare, supporting the enhancement of existing analytical products and the development of new AI and ML solutions under the mentorship of experienced data scientists and consultants. The program is designed for candidates who are newer in their careers and show strong potential, giving them the opportunity to build hands-on experience and technical depth while demonstrating their capabilities on real client and product work. Interns who successfully complete the 12-week internship will receive immediate consideration for a full-time Data Scientist position.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInternship Structure\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe internship runs for 12 weeks. Each intern is assigned to the Indianapolis Data Engineering, Architecture, and Science (IDEAS) team, reports to an experienced data scientist, and is paired with a peer guide for day-to-day support. Interns contribute to active client and product work rather than a standalone project. Performance is reviewed through regular check-ins with the supervisor and a formal end-of-internship evaluation against the entry-level (1i) expectations of Milliman\u0026rsquo;s Data Science job family, covering technical work, quality and documentation, communication, and teamwork. Interns who meet those expectations are considered for conversion to a full-time Data Scientist position immediately following the internship.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eResponsibilities\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIn this role, you will support:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAnalytics \u0026amp; Product Support: \u003c/strong\u003eSupport enhancements to existing AI/analytics products by implementing techniques outlined by project leads, building prototypes, and testing new ideas with guidance and review.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eData Preparation \u0026amp; Exploration: \u003c/strong\u003eUse SQL, Python, or R to pull, clean, manipulate, and visualize healthcare data (e.g., claims and enrollment), and conduct exploratory analyses that help frame business questions.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModel Development: \u003c/strong\u003eHelp build and evaluate statistical and machine learning models, documenting assumptions, inputs, and results so that methods are transparent and reproducible.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQuality \u0026amp; Reasonability Checks: \u003c/strong\u003eIncorporate reasonability checks into work files, recognize possible issues with data and results, and raise them promptly with the project team.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocumentation \u0026amp; QRM: \u003c/strong\u003eFollow Milliman\u0026rsquo;s quality and risk management (QRM) standards, accurately document work product, and complete QRM documentation as directed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCommunication: \u003c/strong\u003ePrepare clear tables, charts, and short written summaries of analyses for internal review, proactively communicate status updates, and clarify task expectations when needed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCross-Functional Collaboration: \u003c/strong\u003eWork alongside actuarial, clinical, pharmacy, policy, and data engineering colleagues to understand requirements and see how analyses support real client decisions.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEngineering Practices: \u003c/strong\u003eLearn and apply team coding standards, including version control (Git/GitHub), code reviews, and modular, reusable code in shared codebases.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLearning \u0026amp; Development: \u003c/strong\u003eActively participate in training, mentoring, and development opportunities to build knowledge of the US healthcare landscape, Medicaid, and data science methods.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eQualifications \u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAnalytical Foundation: \u003c/strong\u003eCoursework or project experience in statistics, machine learning, predictive modeling, or quantitative problem solving, with the ability to explain what you did and why.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProgramming Skills: \u003c/strong\u003eBeginner to intermediate experience in Python, R, or SQL to manipulate, analyze, and visualize data.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eData Tools: \u003c/strong\u003eFamiliarity with commonly used tools such as Excel, notebooks (e.g., Jupyter), and Git; exposure to Databricks, Spark, or cloud data platforms is a plus.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eInterest in Healthcare: \u003c/strong\u003eInterest in US healthcare and public programs such as Medicaid, with a basic understanding of how health coverage and financing work or a strong desire to learn.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAttention to Detail: \u003c/strong\u003eSensitivity to accuracy and data quality, including checking results for reasonableness before sharing them.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCommunication: \u003c/strong\u003eClear written and verbal communication, including the ability to summarize findings for both technical and non-technical audiences.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork Management: \u003c/strong\u003eAbility to stay organized, complete assigned tasks within given timelines, and balance multiple priorities.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCollaboration \u0026amp; Coachability: \u003c/strong\u003eEagerness to learn and work as part of a team, openness to constructive feedback, and willingness to ask questions.\u003c/li\u003e\n\u003cli\u003eBasic knowledge of Gen AI tools, how to utilize AI to enhance productivity, and potential ethical considerations or concerns.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003eRequired\u003c/em\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBachelor\u0026rsquo;s degree in Data Science, Computer Science, Statistics, Mathematics, or a related quantitative field, completed before the start of the internship.\u003c/li\u003e\n\u003cli\u003eHands-on experience programming in Python, R, or SQL through coursework, research, internships, or personal projects. No prior full-time professional experience required.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003ePreferred\u003c/em\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaster\u0026rsquo;s degree (completed or in progress) in Data Science, Computer Science, Statistics, Biostatistics, or a related field.\u003c/li\u003e\n\u003cli\u003ePrior internship, research, or capstone experience applying data science or machine learning to a real-world problem.\u003c/li\u003e\n\u003cli\u003eExposure to healthcare data, such as claims, encounters, electronic health records, or public health data\u003c/li\u003e\n\u003cli\u003eExperience with common Python data science libraries (e.g., pandas, scikit-learn, matplotlib) or R equivalents (e.g., tidyverse).\u003c/li\u003e\n\u003cli\u003eFamiliarity with Git/GitHub and collaborative coding practices such as code reviews.\u003c/li\u003e\n\u003cli\u003eExposure to distributed or cloud data platforms (e.g., Databricks, Spark/PySpark, Azure).\u003c/li\u003e\n\u003cli\u003eCoursework or project experience in areas such as anomaly detection, time series analysis, natural language processing, or generative AI.\u003c/li\u003e\n\u003cli\u003eExperience presenting project results to classmates, faculty, or other stakeholders.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eIndividual(s) must be legally authorized to work in the United States without the need for immigration support or sponsorship from Milliman now or in the future.\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe Team\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe Indianapolis Health Practice has 250+ full-time employees from diverse academic and professional backgrounds. Our practice is structured to serve state Medicaid and other health and human service agencies through dedicated core teams tailored to each client\u0026rsquo;s unique needs. As a member of the Indianapolis Data Engineering, Architecture, and Science (IDEAS) team, you will provide advanced analytics and data science support to key state clients and their core teams under the mentorship of senior data consultants. Our team works cross-functionally with actuarial, policy, finance, pharmacy, clinical, and data management professionals to deliver practical, defensible results. You will work on challenging problems, collaborate with experienced colleagues, and contribute across a variety of client programs and solution areas with opportunities to learn, grow, and take on increasing ownership over time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWho We Are\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIndependent for over 75 years, Milliman delivers market-leading services and solutions to clients worldwide. Today, we are helping companies take on some of the world\u0026rsquo;s most critical and complex issues, including retirement funding and healthcare financing, risk management and regulatory compliance, data analytics, and business transformation.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eMilliman invests in skills training and career development and gives all employees access to a variety of learning and mentoring opportunities. Our growing number of Milliman Employee Resource Groups (ERG\u0026rsquo;s) are employee-led communities that influence policy decisions, develop future leaders, and amplify the voices of their constituents. We encourage our employees to give back to their varied professions, including leadership in professional organizations. Please visit our web site (\u003ca href=\u0022https://www.milliman.com/en/social-impact\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003ehttps://www.milliman.com/en/social-impact\u003c/a\u003e) to learn more about Milliman\u0026rsquo;s commitments to our people, inclusion, and sustainability.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThrough a team of professionals ranging from actuaries to clinicians, technology specialists to plan administrators, we offer unparalleled expertise in employee benefits, investment consulting, healthcare, life insurance and financial services, and property and casualty insurance.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLocation\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe person hired for this role will work in a dynamic, hybrid environment, with 2 to 3 days per week of on-site work required in our Indianapolis office on a weekly basis.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBenefits\u003cbr /\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe offer competitive benefits which include the following based on plan eligibility:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEmployee Assistance Program (EAP) \u0026ndash; Confidential support for personal and work-related challenges.\u003c/li\u003e\n\u003cli\u003e401(k) Plan \u0026ndash; When an employee reaches 1,000 hours worked within 12 consecutive months, they become eligible for a 401(k) plan that includes a company matching program and profit-sharing contributions.\u003c/li\u003e\n\u003cli\u003ePaid Time Off (PTO) \u0026ndash; Begins accruing on the first day of work; Interns, Temporary, and Seasonal Employees will earn PTO each pay period, based on 1 hour for every 30 hours worked.\u003c/li\u003e\n\u003cli\u003eTransportation \u0026ndash; Pre-tax savings for eligible transit and parking expenses.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEqual Opportunity\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAll qualified applicants will receive consideration for employment, without regard to race, color, religion, sex, sexual orientation, national origin, disability, or status as a protected veteran.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e#LI-HYBRID #LI-LB1\u003c/p\u003e","EqualOpportunityEmployerDescription":"Equal Opportunity Employer/Protected Veterans/Individuals with Disabilities\u003cbr\u003e\r\nThis employer is required to notify all applicants of their rights pursuant to federal employment laws.\r\nFor further information, please review the \u003ca href=\u0027https://www.eeoc.gov/poster\u0027 target=\u0027_bla             // ukg-layout-container renders its content in a shadow-DOM .ukg-layout-content
            // div (overflow-y: auto, custom scrollbar) that page CSS cannot reach. Release it
            // while printing so the scrollbar isn't painted into the printout.
            (function () {
                var printStyle;
                window.addEventListener('beforeprint', function () {
                    var root = document.querySelector('ukg-layout-container')?.shadowRoot;
                    if (!root || printStyle) return;
                    printStyle = document.createElement('style');
                    printStyle.textContent = '.ukg-layout-content { overflow: visible !important; height: auto !important; }';
                    root.appendChild(printStyle);
                });
                window.addEventListener('afterprint', function () {
                    printStyle?.remove();
                    printStyle = null;
                });
            })();
        </script>

    <script>
        function escapeHtml(text) {
            if (text == null) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('showBanner') === 'true') {
                const banner = document.getElementById('Successbanner');
                const bannerMessage = escapeHtml($.t("Common.QuickApply.SuccessBannerMessage"));
                const bannerAction = escapeHtml($.t("Layout.AccessibilityBanner.DismissMessage"));
                if (banner) {
                    var ugkBanner = document.createElement('ukg-banner');
                    ugkBanner.setAttribute('inline', '');
                    ugkBanner.setAttribute('type', 'success');
                    ugkBanner.textContent = bannerMessage;

                    var endDiv = document.createElement('div');
                    endDiv.setAttribute('slot', 'end');

                    var ugkButton = document.createElement('ukg-button');
                    ugkButton.setAttribute('aria-label', 'banner-action');
                    ugkButton.setAttribute('emphasis', 'low');
                    ugkButton.textContent = bannerAction;
                    ugkButton.addEventListener('click', dismissBanner);

                    endDiv.appendChild(ugkButton);
                    ugkBanner.appendChild(endDiv);

                    banner.innerHTML = '';
                    banner.appendChild(ugkBanner);
                    banner.style.display = 'block';
                }
            }
        });
        function dismissBanner() {
            const banner = document.getElementById('Successbanner');
            if (banner) {
                banner.style.display = 'none';
            }
        }
        </script>

            $(function () {

                $("#LogOutButton").click(function () {

                });

                $("#skipLink").click(function () {

                });

                $("#skipLink").keyup(function (e) {
                    if (e.keyCode == 13) {
                        SkipToMainContent();
                    }
                });

                function SkipToMainContent() {
                    var ele = $("#PageContainer");
                    if (ele.length > 0) {
                        var scrollTopValue = ele.offset().top;
                        // Toggle-aware scroll value: sanitize when security fix is enabled
                        var scrollValue = true
                            ? Math.floor(Math.max(0, scrollTopValue))  // Security ON: sanitize (safe integer, non-negative)
                            : scrollTopValue;                          // Security OFF: original (backward compatible)

                        $('html, body').animate({
                            scrollTop: scrollValue
                        });

                        var headingEle = ele.find('h1:first, h2:first').eq(0);
                        var focusableElement;
                        if (headingEle.length > 0) {
                            focusableElement = headingEle;
                        } else {
                            focusableElement = ele;
                        }
                        focusableElement.attr("tabindex", "-1").css("outline", "none").focus();

                        return false;
                    }
                }

                $(window).resize(function () {
                    if ($(window).width() <= 767) {
                        $(".nav-pills.nav-responsive").addClass("nav-stacked");
                    } else {
                        $(".nav-pills.nav-responsive").removeClass("nav-stacked");
                    }
                });
                $(window).resize();
            });
